[package]
name = "rusteroids"
version = "0.1.0"
edition = "2024"

[dependencies]
macroquad = { version = "0.4.16", features = ["audio"] }

# Vector graphics are cheap; a release build keeps the 60fps loop comfortable
# even with the 3-pass glow renderer.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
